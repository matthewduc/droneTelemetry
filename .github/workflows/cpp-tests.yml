name: C++ Telemetry Tests

on:
  push:
    branches:
      - main
  
  pull_request:
    branches:
      - main

jobs:
  build-and-test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install C++ tools
        run: |
          sudo apt-get update
          sudo apt-get isntall -y cmake g++

      - name: Configure CMake
        run: |
          cmake -S . -B build

      - name: Build project
        run: |
          cmake --build build

      - name: Run tests
        run: |
          ctest --test-dir build --output-on-failure


# run this workflow when code is pushed to main or when someone opens/updates
# a pull request targeting main. Testing happens automatically
# Github creates a temporary Linux machine for this job